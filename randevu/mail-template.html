<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yeni Randevu Talebi</title>
<style>
  body { background: #f5f5f5; padding: 20px; font-family: Arial, sans-serif;}
  .mail-container { max-width:600px; background:#fff; margin:auto; border-radius:10px; padding:20px; border:1px solid #eee;}
  h2 { color:#2c7c43; text-align:center; margin-top:0; }
  .info-box { margin-bottom:12px; padding:10px; background:#f1f9f4; border-left:5px solid #2c7c43; }
  .label { font-weight:600; }
  .footer { margin-top:20px; text-align:center; font-size:12px; color:#888; }
</style>
</head>
<body>
<div class="mail-container">
  <h2>Yeni Randevu Talebi 📩</h2>
  <div class="info-box"><span class="label">Ad Soyad:</span> {{adSoyad}}</div>
  <div class="info-box"><span class="label">Telefon:</span> {{telefon}}</div>
  <div class="info-box"><span class="label">E-posta:</span> {{email}}</div>
  <div class="info-box"><span class="label">Randevu Tarihi:</span> {{tarih}}</div>
  <div class="info-box"><span class="label">Mesaj:</span><br>{{mesaj}}</div>
  <div class="footer">Bu mail otomatik gönderilmiştir.</div>
</div>
</body>
</html>
